name: Validate standalone Skills

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone-skills:
    name: Standalone Skills / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            ai-video-shot-script-director/requirements.txt
            frozen-moment-camera-coverage/requirements.txt
            material-sensitive-product-master-asset-board/requirements.txt
            packaging-product-identity-label-lock-board/requirements.txt

      - name: Install standalone package dependencies
        run: python -m pip install --disable-pip-version-check -r ai-video-shot-script-director/requirements.txt -r frozen-moment-camera-coverage/requirements.txt -r material-sensitive-product-master-asset-board/requirements.txt -r packaging-product-identity-label-lock-board/requirements.txt

      - name: Install FFmpeg on Ubuntu
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg

      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ffmpeg --no-progress -y

      - name: Test the repository-level standalone validator
        run: python .github/scripts/test_validate_standalone_skills.py

      - name: Test the package-scoped standalone release controller
        run: python .github/scripts/test_manage_standalone_skill_release.py

      - name: Validate all 17 Skills in isolated package roots
        run: python .github/scripts/validate_standalone_skills.py --repo-root . --expected-count 17 --timeout 180 --compact

      - name: Run undeclared package-local tests in isolated package roots
        run: python .github/scripts/run_undeclared_standalone_tests.py --repo-root . --timeout 180

      - name: Parse standalone PowerShell wrappers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path .\advertising-reference-research-director\scripts\preflight.ps1),
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List | Out-String | Write-Error
            exit 1
          }

      - name: Validate standalone POSIX wrapper syntax
        if: runner.os != 'Windows'
        shell: bash
        run: bash -n advertising-reference-research-director/scripts/preflight.sh

      - name: Exercise standalone POSIX wrapper
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export AI_AD_REFERENCE_PYTHON="$(command -v python)"
          advertising-reference-research-director/scripts/preflight.sh --format json

      - name: Exercise standalone Windows PowerShell wrapper
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:AI_AD_REFERENCE_PYTHON = (Get-Command python).Source
          .\advertising-reference-research-director\scripts\preflight.ps1 -Format json

      - name: Exercise standalone Windows PowerShell 5.1 wrapper
        if: runner.os == 'Windows' && matrix.python == '3.11'
        shell: powershell
        run: |
          $pythonCommand = Get-Command python -CommandType Application | Select-Object -First 1
          $pythonPath = if ($pythonCommand.Path) { $pythonCommand.Path } else { $pythonCommand.Definition }
          if (-not $pythonPath) { throw 'Could not resolve the Python executable path' }
          $env:AI_AD_REFERENCE_PYTHON = $pythonPath
          .\advertising-reference-research-director\scripts\preflight.ps1 -Format json
